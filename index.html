<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description"
    content="Estufa da Varanda: gestão web de plantas, regas, eventos, fotos, clima e cuidados." />

  <meta name="theme-color" content="#166534" />
  <meta name="color-scheme" content="light dark" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <script>
    (() => {
      const storageKey = "estufa-da-varanda.theme";

      try {
        const storedTheme = window.localStorage.getItem(storageKey);
        const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches;
        const theme = storedTheme === "light" || storedTheme === "dark"
          ? storedTheme
          : prefersDark
            ? "dark"
            : "light";

        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;

        const themeColor = document.querySelector('meta[name="theme-color"]');

        if (themeColor) {
          themeColor.setAttribute("content", theme === "dark" ? "#052e16" : "#166534");
        }
      } catch {
        document.documentElement.classList.remove("dark");
        document.documentElement.dataset.theme = "light";
        document.documentElement.style.colorScheme = "light";
      }
    })();
  </script>

  <link rel="icon" type="image/svg+xml" href="/LogoIcon.svg" />
  <link rel="shortcut icon" href="/LogoIcon.svg" />

  <title>Estufa da Varanda</title>
</head>

<body>
  <noscript>Você precisa habilitar JavaScript para usar o Estufa da Varanda.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
